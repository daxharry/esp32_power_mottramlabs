    update_interval: 1s
    sample_duration: 200ms
    filters:
      - calibrate_linear:
         method: exact
         datapoints:
          - 0 -> 0
          - 0.004 -> 1
          - 0.005 -> 3
          - 0.018 -> 3.5
          - 0.023 -> 4
          - 0.026 -> 5
          - 0.033 -> 6.5
          - 0.041 -> 7
          - 0.044 -> 7.1
          - 0.047 -> 7.2
          - 0.050 -> 7.3
          - 0.054 -> 7.5
          - 0.055 -> 7.5
          - 0.056 -> 7.8
          - 0.058 -> 8
          - 0.060 -> 8.5
          - 0.062 -> 9
          - 0.068 -> 10
          - 0.069 -> 10.5
          - 0.072 -> 11
          - 0.073 -> 11.5
          - 0.078 -> 12
      - sliding_window_moving_average:
          window_size: 3
          send_every: 3
          send_first_at: 3
      - lambda: |-
          if (x < 0) {
            return 0;
          } else if (x > 13) {
            return 13;
          } else {
            return x;
          }

  - platform: template
    name: CT3 Current
    id: ct3_current
    lambda: return id(ct3_a).state;
    accuracy_decimals: 3
    unit_of_measurement: a
    icon: "mdi:current-ac"
    update_interval: 1s

################ Channel 4 ################
  - platform: adc
    pin: GPIO39
    id: ct4_adc
    attenuation: auto
    internal: true

  - platform: ct_clamp
    sensor: ct4_adc
    id: ct4_a
    update_interval: 1s
    sample_duration: 200ms
    filters:
      - calibrate_linear:
         method: exact
         datapoints:
          - 0.033 -> 0.0
          - 0.037 -> 3.22
          - 0.038 -> 3.45
          - 0.042 -> 4.80
          - 0.077 -> 7.85
          - 0.080 -> 9.36
          - 0.085 -> 10.5
          - 0.089 -> 10.7
          - 0.092 -> 11
          - 0.093 -> 11.2
          - 0.096 -> 11.5
          - 0.100 -> 12
      - sliding_window_moving_average:
          window_size: 3
          send_every: 3
          send_first_at: 3
      - lambda: |-
          if (x < 0) {
            return 0;
          } else if (x > 13) {
            return 13;
          } else {
            return x;
          }

  - platform: template
    name: CT4 Current
    id: ct4_current
    lambda: return id(ct4_a).state;
    accuracy_decimals: 3
    unit_of_measurement: a
    icon: "mdi:current-ac"
