esphome:
  name: esp32-power
  friendly_name: esp32-power

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp32-Power Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

time:
  - platform: homeassistant
    id: homeassistant_time

switch:
   - platform: restart
     name: "Restart"

sensor:
################ Channel 1 ################
  - platform: adc
    pin: GPIO34
    id: ct1_adc
    attenuation: auto
    internal: true

  - platform: ct_clamp
    sensor: ct1_adc
    id: ct1_a
    update_interval: 1s
    sample_duration: 200ms
    filters:
      - calibrate_linear:
         method: exact
         datapoints:
          - 0.019 -> 0
          - 0.020 -> 2
          - 0.047 -> 2.2
          - 0.060 -> 4.6
          - 0.072 -> 5.5
          - 0.083 -> 7
          - 0.09 -> 7.6
          - 0.092 -> 8
          - 0.097 -> 8.47
          - 0.122 -> 10.6
          - 0.145 -> 12.9
          - 0.242 -> 21.64
          - 0.35 -> 31
      - sliding_window_moving_average:
          window_size: 3
          send_every: 3
          send_first_at: 3
      - lambda: |-
          if (x < 0) {
            return 0;
          } else if (x > 32) {
            return 32;
          } else {
            return x;
          }

  - platform: template
    name: CT1 Current
    id: ct1_current
    lambda: return id(ct1_a).state;
    accuracy_decimals: 3
    unit_of_measurement: a
    icon: "mdi:current-ac"
    update_interval: 1s

################ Channel 2 ################
  - platform: adc
    pin: GPIO35
    id: ct2_adc
    attenuation: auto
    internal: true

  - platform: ct_clamp
    sensor: ct2_adc
    id: ct2_a
    update_interval: 1s
    sample_duration: 200ms
    filters:
      - calibrate_linear:
         method: exact
         datapoints:
          - 0.005 -> 0.2
          - 0.006 -> 0.4
          - 0.010 -> 1
      - sliding_window_moving_average:
          window_size: 3
          send_every: 3
          send_first_at: 3
      - lambda: |-
          if (x < 0) {
            return 0;
          } else if (x > 1) {
            return 1;
          } else {
            return x;
          }

  - platform: template
    name: CT2 Current
    id: ct2_current
    lambda: return id(ct2_a).state;
    accuracy_decimals: 3
    unit_of_measurement: a
    icon: "mdi:current-ac"
    update_interval: 1s

################ Channel 3 ################
